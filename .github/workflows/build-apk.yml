name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Build Release APK (Standalone with embedded bundle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.enableMinifyInReleaseBuilds=false --no-daemon

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lift-v1.0.7-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: 🚀 Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Lift-v1.0.7.apk
          gh release upload v1.0.0 Lift-v1.0.7.apk#Lift-v1.0.0.apk --clobber || true
          gh release upload v1.0.6 Lift-v1.0.7.apk#Lift-v1.0.6.apk --clobber || true
          gh release create v1.0.7 Lift-v1.0.7.apk --title "L!FT v1.0.7 (Android APK)" --notes "L!FT v1.0.7: Hands-free Offline Voice Logging for sets! Speak naturally ('225 for 8', 'two plates for 10', '100kg 8 reps', 'same weight for 10', 'bodyweight 15', 'RPE 8'), with on-device speech recognition, live transcript preview, and automatic set completion." || gh release upload v1.0.7 Lift-v1.0.7.apk --clobber
